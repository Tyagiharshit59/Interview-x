# Run the whole product on one machine:  docker compose up --build
# Put a TLS-terminating reverse proxy (Caddy/nginx/Traefik) in front for HTTPS: browsers require HTTPS for camera access
# on anything other than localhost.
services:
  app:
    build: .
    ports: ["4000:4000"]
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      APP_URL: ${APP_URL:-http://localhost:4000}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-admin@intervuex.local}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?set SUPER_ADMIN_PASSWORD}
      CODE_RUNNER: ${CODE_RUNNER:-disabled}
      JUDGE0_URL: ${JUDGE0_URL:-}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ICE_SERVERS: ${ICE_SERVERS:-[{"urls":"stun:stun.l.google.com:19302"}]}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    volumes:
      - appdata:/data
    restart: unless-stopped
volumes:
  appdata:
